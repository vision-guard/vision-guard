version: '3.8'

services:
  # ─────────────────────────────────────────────────────
  # Nginx Reverse Proxy — the ONLY externally exposed service
  # ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vision_guard_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      client:
        condition: service_started
      orchestration_service:
        condition: service_healthy
      camera_service:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - vision_guard_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ─────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    container_name: vision_guard_rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 1024M

  postgres:
    image: postgres:15-alpine
    container_name: vision_guard_postgres
    environment:
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: vision_password
      POSTGRES_DB: vision_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: vision_guard_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────
  # Application Services (all internal-only)
  # ─────────────────────────────────────────────────────
  camera_service:
    build: ./camera_service
    container_name: vision_guard_camera
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      USE_WEBCAM: "False"
      RABBITMQ_HOST: rabbitmq
    # devices:
    #   - "/dev/video0:/dev/video0" # Optional, only if device exists
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 768M

  algorithm_service:
    build: ./algorithm_service
    container_name: vision_guard_algorithm
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      USE_GPU: "False"
      RABBITMQ_HOST: rabbitmq
      MODEL_PATH: /app/sentinel_best_f1.pth
      VIOLENCE_THRESHOLD: "0.5"
      PROB_SMOOTHING_WINDOW: "5"
      CONSECUTIVE_WINDOWS_TO_ALERT: "3"
      ALERT_COOLDOWN_SECONDS: "3"
      CAMERA_IDS: "cam_1,cam_2,cam_3,cam_4"
    volumes:
      - ./algorithm_service/sentinel_best_f1.pth:/app/sentinel_best_f1.pth
    networks:
      - vision_guard_net
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2.5G
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]

  orchestration_service:
    build: ./orchestration_service
    container_name: vision_guard_orchestration
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: vision_password
      POSTGRES_DB: vision_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      RABBITMQ_HOST: rabbitmq
      CAMERA_IDS: "cam_1,cam_2,cam_3,cam_4"
      # Production URLs — routed through nginx
      CAMERA_STREAM_EXTERNAL_URL: "/live"
      MINIO_EXTERNAL_HOST: "visionguard.cs.colman.ac.il/minio-storage"
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 1024M

  client:
    build: ./client
    container_name: vision_guard_client
    networks:
      - vision_guard_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  vision_guard_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
