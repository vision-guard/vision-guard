worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ───────────────────────────────────────────────
    # Upstream definitions (Docker service names)
    # ───────────────────────────────────────────────
    upstream client {
        server client:3000;
    }

    upstream orchestration {
        server orchestration_service:8001;
    }

    upstream camera {
        server camera_service:8000;
    }

    upstream minio_storage {
        server minio:9000;
    }

    # ───────────────────────────────────────────────
    # Main server block
    # ───────────────────────────────────────────────
    server {
        listen 80;
        server_name visionguard.cs.colman.ac.il localhost;

        # Allow large video uploads / responses
        client_max_body_size 500M;

        # ── Frontend (Vite preview) ──
        location / {
            proxy_pass http://client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for Vite HMR in dev, harmless in prod)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Orchestration API ──
        location /api/ {
            proxy_pass http://orchestration;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Detect upstream failures quickly
            proxy_connect_timeout 10s;
            # Longer timeouts for API calls that may involve DB queries
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Suspected Videos endpoint (mounted at /suspected_videos in orchestration) ──
        location /suspected_videos {
            proxy_pass http://orchestration;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Detect upstream failures quickly
            proxy_connect_timeout 10s;
            # Timeouts for DB-backed queries
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Live MJPEG Video Streams (per-camera: /live/cam_1, /live/cam_2, etc.) ──
        location /live/ {
            proxy_pass http://camera;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CRITICAL for MJPEG streaming:
            # Disable buffering so frames are sent to the client immediately
            proxy_buffering off;
            proxy_cache off;

            # Chunked transfer encoding support
            chunked_transfer_encoding on;

            # Long timeouts — the stream runs indefinitely
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            send_timeout 86400s;
        }

        # ── Camera Health Check (supports /health and /health/{camera_id}) ──
        location /health {
            proxy_pass http://camera;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Camera List ──
        location /cameras {
            proxy_pass http://camera;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── MinIO Storage (video clip playback) ──
        # Rewrites /minio-storage/bucket/object → /bucket/object on MinIO
        location /minio-storage/ {
            rewrite ^/minio-storage/(.*)$ /$1 break;
            proxy_pass http://minio_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Video files can be large
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
